services:
  nps-app:
    ports: !override
      - "127.0.0.1:8082:80"
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.middlewares.nps-indmotos-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.nps-indmotos-redirect.entrypoints: web
      traefik.http.routers.nps-indmotos-redirect.middlewares: nps-indmotos-https-redirect
      traefik.http.routers.nps-indmotos-redirect.rule: Host(`nps.vorticehub.com`)
      traefik.http.routers.nps-indmotos-redirect.service: nps-indmotos-web
      traefik.http.routers.nps-indmotos-web.entrypoints: websecure
      traefik.http.routers.nps-indmotos-web.rule: Host(`nps.vorticehub.com`)
      traefik.http.routers.nps-indmotos-web.service: nps-indmotos-web
      traefik.http.routers.nps-indmotos-web.tls: "true"
      traefik.http.routers.nps-indmotos-web.tls.certresolver: letsencrypt
      traefik.http.services.nps-indmotos-web.loadbalancer.server.port: "80"
    networks:
      - default
      - dokploy

  evolution-api:
    ports: !override
      - "127.0.0.1:8083:8080"

networks:
  dokploy:
    external: true
    name: dokploy-network
